[package]
name = "pstd"
version = "0.1.0"
edition = "2021"
description = "PST email data extractor"
license = "MIT"
default-run = "pstd"

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["now", "serde"] }
clap = { version = "4.5", features = ["derive"] }
encoding_rs = "=0.8.35"
hex = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tar = { version = "0.4", default-features = false }
thiserror = "1"
zip = { version = "2", default-features = false, features = ["deflate"] }

[dev-dependencies]
tempfile = "3"

[profile.release]
# One codegen unit plus cross-crate LTO gives the parser hot loops full inlining and
# drops unused dependency code; symbols are stripped from the shipped binary.
codegen-units = 1
lto = true
strip = true
