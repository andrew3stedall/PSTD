name: Temporary PERF-01 formatting
on:
  pull_request:
    branches: [main]
jobs:
  format:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'agent/perf-output-indexes'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt
      - run: cargo test --test content_output_scaling
      - name: Commit formatting for intended Rust files
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/output/attachment_index.rs src/output/attachment_store.rs src/output/attachment_text.rs src/output/reconstruction.rs src/engine/runner.rs src/output/mod.rs tests/content_output_scaling.rs examples/content_output_benchmark.rs
          if ! git diff --cached --quiet; then
            git commit -m 'Format content output scaling changes'
            git push origin HEAD:refs/heads/agent/perf-output-indexes
          fi
