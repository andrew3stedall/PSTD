name: Temporary readpst harness formatter

on:
  push:
    branches:
      - agent/readpst-rp-m0-02-differential-runner

permissions:
  contents: write

jobs:
  format:
    if: github.actor == 'andrew3stedall'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/readpst-rp-m0-02-differential-runner
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt
      - name: Commit formatted harness
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "andrew3stedall"
          git config user.email "19498307+andrew3stedall@users.noreply.github.com"
          git add tests/readpst_diff tests/readpst_diff_runner.rs
          git commit -m "style: format readpst differential harness"
          git push origin HEAD:agent/readpst-rp-m0-02-differential-runner
