name: Readpst special items

on:
  pull_request:
  push:
    branches: [main]

jobs:
  special-items:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo test special
      - run: cargo clippy --all-targets --all-features -- -D warnings -A clippy::too_many_arguments
      - run: cargo fmt --check
      - name: Verify typed special items and deterministic MIME projections
        shell: bash
        run: |
          set -euo pipefail
          fixture="tests/fixtures/pst/sample.pst"
          fixture_sha256="ee997fc7dd5c40bef49b753b782f76b17109057b18c19232cc87e0b63e0711fe"
          evidence="/tmp/pstd-special-items"
          first="/tmp/pstd-special-items-first"
          second="/tmp/pstd-special-items-second"
          mkdir -p "$evidence" "$first" "$second"
          printf '%s  %s\n' "$fixture_sha256" "$fixture" | sha256sum --check -

          cargo run -- extract --input "$fixture" --output "$first" --overwrite \
            > "$evidence/first.stdout" 2> "$evidence/first.stderr"
          cargo run -- extract --input "$fixture" --output "$second" --overwrite \
            > "$evidence/second.stdout" 2> "$evidence/second.stderr"

          for output in "$first" "$second"; do
            tar_file=$(find "$output/archives" -type f -name '*.tar' | sort | head -n 1)
            destination="$evidence/$(basename "$output")"
            mkdir -p "$destination"
            tar -xf "$tar_file" -C "$destination"
            test -s "$destination/data/special_items.jsonl"
          done

          cmp "$evidence/pstd-special-items-first/data/special_items.jsonl" \
            "$evidence/pstd-special-items-second/data/special_items.jsonl"

          python - <<'PY'
          import json
          from pathlib import Path

          archive = Path('/tmp/pstd-special-items/pstd-special-items-first')

          def records(name):
              return [
                  json.loads(line)
                  for line in (archive / 'data' / name).read_text(encoding='utf-8').splitlines()
                  if line.strip()
              ]

          specials = records('special_items.jsonl')
          mime_parts = records('mime_parts.jsonl')
          evidence = records('evidence.jsonl')
          if len({item['special_key'] for item in specials}) != len(specials):
              raise SystemExit('duplicate special item key')
          if not any(item['kind'] == 'rtf_synthetic' for item in specials):
              raise SystemExit('approved body fixture did not produce RTF special evidence')
          for item in specials:
              if item['synthetic'] and item['authoritative']:
                  raise SystemExit('synthetic special item was marked authoritative')
              if item['kind'] == 'encrypted' and item['decoded_sha256'] is not None:
                  raise SystemExit('encrypted body was reported as decoded')
              if not item['authoritative'] and item['status'].endswith('source_body_unavailable'):
                  if item['raw_sha256'] is not None or item['decoded_sha256'] is not None:
                      raise SystemExit('unavailable special body retained guessed hashes')
              links = [
                  record for record in evidence
                  if record['source_ref'].startswith('special:' + item['special_key'] + ';')
              ]
              if len(links) != 1 or links[0]['evidence_kind'] != 'special_item':
                  raise SystemExit('special item evidence link is absent or inconsistent')
          rtf_specials = [item for item in specials if item['kind'] == 'rtf_synthetic']
          synthetic_rtf_parts = [
              part for part in mime_parts if part['part_type'] == 'synthetic_rtf_attachment'
          ]
          if len(synthetic_rtf_parts) != len(rtf_specials):
              raise SystemExit('RTF special records and MIME parts do not reconcile')
          if any(part['authoritative'] for part in synthetic_rtf_parts):
              raise SystemExit('synthetic RTF MIME part was marked authoritative')
          Path('/tmp/pstd-special-items/special-items-report.json').write_text(
              json.dumps({
                  'fixture': 'tests/fixtures/pst/sample.pst',
                  'fixture_sha256': 'ee997fc7dd5c40bef49b753b782f76b17109057b18c19232cc87e0b63e0711fe',
                  'special_item_count': len(specials),
                  'rtf_synthetic_count': len(rtf_specials),
                  'synthetic_mime_count': len(synthetic_rtf_parts),
                  'deterministic_special_jsonl': True,
                  'encrypted_decoding_forbidden': True,
              }, indent=2) + '\n', encoding='utf-8'
          )
          PY
      - name: Verify standalone synthetic body attachment adapter
        shell: bash
        run: |
          set -euo pipefail
          fixture="tests/fixtures/pst/sample.pst"
          evidence="/tmp/pstd-synthetic-body-attachments"
          inline="$evidence/inline"
          external_first="$evidence/external-first"
          external_second="$evidence/external-second"
          mkdir -p "$evidence"

          cargo run --quiet --bin pstd-eml -- "$fixture" "$inline" \
            > "$evidence/inline.stdout" 2> "$evidence/inline.stderr"
          cargo run --quiet --bin pstd-eml -- --attachment-mode external "$fixture" "$external_first" \
            > "$evidence/external-first.stdout" 2> "$evidence/external-first.stderr"
          cargo run --quiet --bin pstd-eml -- --attachment-mode external "$fixture" "$external_second" \
            > "$evidence/external-second.stdout" 2> "$evidence/external-second.stderr"

          test -n "$(find "$inline" -type f -name '*.eml' -print -quit)"
          test -f "$external_first/attachments.jsonl"
          diff -ru "$external_first" "$external_second"

          python - <<'PY'
          import hashlib
          import json
          from email import policy
          from email.parser import BytesParser
          from pathlib import Path

          root = Path('/tmp/pstd-synthetic-body-attachments')
          inline_parts = {}
          for path in sorted((root / 'inline').glob('*.eml')):
              message = BytesParser(policy=policy.default).parsebytes(path.read_bytes())
              for part in message.walk():
                  filename = part.get_filename()
                  if filename:
                      inline_parts.setdefault(filename, []).append(part.get_payload(decode=True) or b'')
          records = [
              json.loads(line)
              for line in (root / 'external-first' / 'attachments.jsonl').read_text().splitlines()
              if line.strip()
          ]
          synthetic = [record for record in records if record.get('synthetic')]
          if not synthetic:
              raise SystemExit('fixture did not produce synthetic body attachment records')
          emitted = 0
          for record in synthetic:
              if not record.get('source_body_key'):
                  raise SystemExit('synthetic record is missing source_body_key')
              if record.get('authoritative') is not False:
                  raise SystemExit('synthetic record is not explicitly non-authoritative')
              if not record.get('extraction_status', '').startswith('synthetic_'):
                  raise SystemExit('synthetic record has no synthetic extraction status')
              if record['materialization_status'] == 'attachment_file_emitted':
                  emitted += 1
                  path = root / 'external-first' / record['materialized_path']
                  data = path.read_bytes()
                  if len(data) != record['size_bytes']:
                      raise SystemExit('materialized synthetic size does not match manifest')
                  if hashlib.sha256(data).hexdigest() != record['sha256']:
                      raise SystemExit('materialized synthetic hash does not match manifest')
                  inline_payloads = inline_parts.get(record['filename_safe'], [])
                  if not inline_payloads:
                      raise SystemExit('inline EML omitted a materialized synthetic filename')
                  if not any(
                      len(data) == record['size_bytes']
                      and hashlib.sha256(data).hexdigest() == record['sha256']
                      for data in inline_payloads
                  ):
                      raise SystemExit('inline EML synthetic bytes do not match the manifest')
              elif record['materialization_status'] != 'attachment_payload_unavailable':
                  raise SystemExit('unexpected synthetic materialization status')
          if emitted == 0:
              raise SystemExit('fixture produced no materialized synthetic body payload')
          (root / 'adapter-report.json').write_text(json.dumps({
              'synthetic_record_count': len(synthetic),
              'materialized_synthetic_count': emitted,
              'external_repeat_identical': True,
              'inline_and_external_hashes_checked': True,
              'invalid_or_unavailable_sources_remain_explicit': True,
          }, indent=2) + '\n')
          PY
      - name: Upload special-item evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: readpst-special-item-evidence
          path: /tmp/pstd-special-items
          if-no-files-found: error
