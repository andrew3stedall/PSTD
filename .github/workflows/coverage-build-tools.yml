name: Coverage temporary build tools
on:
  pull_request:
    types: [opened, synchronize, reopened]
permissions:
  contents: write
concurrency:
  group: coverage-focused-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  tools:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'agent/coverage-foundation'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Format and test bounded implementation
        run: |
          cargo fmt
          cargo test --lib pst::bth::tests
          cargo test --lib pst::property_context::tests
          cargo test --lib pst::node_payload::tests
      - name: Persist formatting only if branch still matches tested source
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          git add src/pst/bth.rs src/pst/property_context.rs src/pst/node_payload.rs
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "[COVERAGE-01] Format tested BTH source increment"
            git push origin HEAD:refs/heads/agent/coverage-foundation
          fi
