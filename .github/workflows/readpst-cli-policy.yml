name: Readpst CLI policy

on:
  pull_request:
  push:
    branches: [main]

jobs:
  cli-policy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo test cli
      - run: cargo test item_envelope
      - run: cargo clippy --all-targets --all-features -- -D warnings -A clippy::too_many_arguments
      - run: cargo fmt --check
      - name: Verify typed policy translation and fail-closed profiles
        shell: bash
        run: |
          set -euo pipefail
          fixture="tests/fixtures/pst/sample.pst"
          fixture_sha256="ee997fc7dd5c40bef49b753b782f76b17109057b18c19232cc87e0b63e0711fe"
          evidence="/tmp/pstd-cli-policy"
          first="/tmp/pstd-cli-policy-first"
          second="/tmp/pstd-cli-policy-second"
          mkdir -p "$evidence" "$first" "$second"
          printf '%s  %s\n' "$fixture_sha256" "$fixture" | sha256sum --check -

          cargo run -- extract --help > "$evidence/help.txt"
          grep -q -- '--output-profile' "$evidence/help.txt"
          grep -q -- '--include-deleted' "$evidence/help.txt"
          grep -q -- '--item-types' "$evidence/help.txt"

          for output in "$first" "$second"; do
            cargo run -- extract \
              --input "$fixture" \
              --output "$output" \
              --output-profile canonical \
              --include-deleted \
              --item-types c \
              --jobs 2 \
              --diagnostics debug \
              --collision suffix
            tar_file=$(find "$output/archives" -type f -name '*.tar' | sort | head -n 1)
            destination="$evidence/$(basename "$output")"
            mkdir -p "$destination"
            tar -xf "$tar_file" -C "$destination"
          done

          cmp "$evidence/pstd-cli-policy-first/data/items.jsonl" \
            "$evidence/pstd-cli-policy-second/data/items.jsonl"
          cmp "$evidence/pstd-cli-policy-first/_pstfast/run_config.json" \
            "$evidence/pstd-cli-policy-second/_pstfast/run_config.json"

          set +e
          cargo run -- extract \
            --input "$fixture" \
            --output "$evidence/unsupported" \
            --output-profile msg > "$evidence/unsupported.log" 2>&1
          unsupported_status=$?
          set -e
          test "$unsupported_status" -eq 1
          grep -q 'RPCLI_UNSUPPORTED_OUTPUT_PROFILE' "$evidence/unsupported.log"

          set +e
          cargo run -- extract \
            --input "$fixture" \
            --output "$evidence/invalid-extension" \
            --attachment-extensions '../escape' > "$evidence/invalid-extension.log" 2>&1
          extension_status=$?
          set -e
          test "$extension_status" -eq 1
          grep -q 'RPCLI_INVALID_ATTACHMENT_EXTENSION' "$evidence/invalid-extension.log"

          python - <<'PY'
          import json
          from pathlib import Path

          archive = Path('/tmp/pstd-cli-policy/pstd-cli-policy-first')
          policy = json.loads((archive / '_pstfast' / 'run_config.json').read_text())['readpst_policy']
          assert policy['output_profile'] == 'canonical'
          assert policy['include_deleted'] is True
          assert policy['item_type_filter'] == 'contact'
          assert policy['jobs'] == 2
          assert policy['diagnostics'] == 'debug'
          items = [
              json.loads(line)
              for line in (archive / 'data' / 'items.jsonl').read_text().splitlines()
              if line.strip()
          ]
          assert all(item['raw_evidence_refs'] for item in items)
          assert any(item['routing_status'] == 'filtered_item_type' for item in items)
          Path('/tmp/pstd-cli-policy/report.json').write_text(
              json.dumps({
                  'fixture': 'tests/fixtures/pst/sample.pst',
                  'fixture_sha256': 'ee997fc7dd5c40bef49b753b782f76b17109057b18c19232cc87e0b63e0711fe',
                  'deterministic_items_jsonl': True,
                  'deterministic_policy_json': True,
                  'unsupported_profiles_fail_closed': True,
                  'invalid_attachment_extensions_fail_closed': True,
                  'canonical_evidence_retained_after_filter': True,
              }, indent=2) + '\n'
          )
          PY
      - name: Upload CLI policy evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: readpst-cli-policy-evidence
          path: /tmp/pstd-cli-policy
          if-no-files-found: error
