name: Temporary branch formatter

on:
  push:
    branches:
      - agent/readpst-rp-m1-01-capability-envelope

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/readpst-rp-m1-01-capability-envelope
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Format branch
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --all
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "style: format RP-M1-01 capability slice"
          git push origin HEAD:agent/readpst-rp-m1-01-capability-envelope
