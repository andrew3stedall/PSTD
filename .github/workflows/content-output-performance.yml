name: Content output performance

on:
  pull_request:
    paths:
      - 'src/**'
      - 'Cargo.*'
      - 'examples/content_output_benchmark.rs'
      - 'scripts/benchmark_content_output.py'
      - '.github/workflows/content-output-performance.yml'
  workflow_dispatch:
    inputs:
      baseline:
        description: Baseline commit to compare
        required: true
        default: ad22804728575fdedd1e2abf1da1ac5c9f420de3

permissions:
  contents: read

jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: dtolnay/rust-toolchain@stable
      - name: Compare release output speed, memory and exact bytes
        env:
          BASELINE_SHA: ${{ github.event.pull_request.base.sha || inputs.baseline }}
        run: python scripts/benchmark_content_output.py --baseline "$BASELINE_SHA"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: content-output-performance
          path: content-output-performance.json
